# Boundary policy for the GDScript fixture. The ui_bad.gd module deliberately
# omits its dependency on stats.gd; scripts/godot_boundaries.py check fixture/godot
# fails until that row is added, mirroring the Python poison fixture.
[[modules]]
path = "data.gd"
depends_on = []

[[modules]]
path = "stats.gd"
depends_on = ["data.gd"]

[[modules]]
path = "ui_bad.gd"
depends_on = []
